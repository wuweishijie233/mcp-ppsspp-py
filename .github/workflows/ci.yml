name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: test (python ${{ matrix.python }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Compile check
        run: python -m compileall -q src scripts tests

      - name: Tests
        run: python -m pytest -q

      - name: Verify package & console script
        shell: bash
        run: |
          python -c "import mcp_ppsspp, mcp_ppsspp.server, mcp_ppsspp.tools, mcp_ppsspp.ppsspp"
          set +e
          out=$(PPSSPP_PORT= mcp-ppsspp 2>&1)
          code=$?
          set -e
          test "$code" -eq 1 || { echo "expected exit 1, got $code"; exit 1; }
          echo "$out" | grep -q "PPSSPP_PORT not set" || { echo "missing FATAL message"; exit 1; }
          echo "console script OK"

  ci-ok:
    name: ci-ok
    needs: build
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Verify all matrix builds passed
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "matrix build did not fully succeed: ${{ needs.build.result }}"
            exit 1
          fi
          echo "all matrix builds passed"
