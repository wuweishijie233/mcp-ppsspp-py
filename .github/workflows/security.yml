name: Daily security scan

# Report-only dependency audit (pip-audit) plus a dependency-freshness check
# that opens an issue when newer versions of installed packages are
# available. The audit never drives a fix automatically - findings are
# uploaded to code scanning for review.

on:
  schedule:
    - cron: '17 6 * * *' # daily, 06:17 UTC - off the hour to dodge peak queueing
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    name: pip-audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: pip install -e .
      - run: pip install pip-audit

      - name: pip-audit
        continue-on-error: true # findings must not fail the scheduled run
        run: pip-audit --format sarif --output pip-audit.sarif

      - name: Upload SARIF to code scanning
        if: hashFiles('pip-audit.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: pip-audit.sarif
          category: pip-audit

  refresh:
    name: dependency freshness
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Collect outdated packages
        id: outdated
        run: |
          pip install -e .
          pip list --outdated --format=json > /tmp/outdated.json || true
          count=$(python -c "import json; print(len(json.load(open('/tmp/outdated.json'))))")
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: File / update refresh issue
        if: steps.outdated.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY=$(python - <<'EOF'
          import json
          data = json.load(open('/tmp/outdated.json'))
          lines = [f"- `{p['name']}` {p['version']} -> {p['latest_version']}" for p in data]
          print("The scheduled freshness check found newer versions of installed packages.\n\n" + "\n".join(lines))
          EOF
          )
          TITLE="Dependency refresh: newer versions available"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            echo "Updating existing issue #$EXISTING instead of filing a duplicate."
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
